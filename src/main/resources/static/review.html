<!DOCTYPE html>
<html lang="en">
<head>
    <title>Write Review | BookSaw</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="css/normalize.css">
    <link rel="stylesheet" type="text/css" href="icomoon/icomoon.css">
    <link rel="stylesheet" type="text/css" href="css/vendor.css">
    <link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap">
	<link rel="stylesheet" type="text/css" href="css/modern-override.css">
    <link rel="stylesheet" type="text/css" href="css/modern-theme.css">
    <style>
        /* Modern Star Rating Overrides */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 15px;
        }

        .star-input {
            display: none;
        }

        .star-label {
            font-size: 50px;
            cursor: pointer;
            color: #e0e0e0;
            transition: all 0.2s ease;
        }

        .star-label:hover,
        .star-label:hover ~ .star-label {
            color: #f5c518;
            transform: scale(1.1);
        }

        .star-input:checked ~ .star-label {
            color: #f5c518;
        }
        
        .rating-display {
            text-align: center;
            font-weight: 600;
            color: var(--brand-mocha);
            margin-top: 15px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body data-bs-spy="scroll" data-bs-target="#header" tabindex="0">

    <div id="header-wrap">
        <div class="top-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-6">
                        <div class="social-links">
                            <ul>
                                <li><a href="#"><i class="icon icon-facebook"></i></a></li>
                                <li><a href="#"><i class="icon icon-twitter"></i></a></li>
                                <li><a href="#"><i class="icon icon-youtube-play"></i></a></li>
                                <li><a href="#"><i class="icon icon-behance-square"></i></a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="right-element">
                            <a href="#" class="user-account for-buy"><i class="icon icon-user"></i><span id="userGreeting">Account</span></a>
                            <a href="cart.html" class="cart for-buy"><i class="icon icon-clipboard"></i><span>Cart:(0 $)</span></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <header id="header">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-2">
                        <div class="main-logo">
                            <a href="index.html"><img src="images/main-logo.png" alt="logo"></a>
                        </div>
                    </div>
                    <div class="col-md-10">
                        <nav id="navbar">
                            <div class="main-menu stellarnav">
                                <ul class="menu-list">
                                    <li class="menu-item"><a href="index.html">Home</a></li>
                                    <li class="menu-item"><a href="index.html#featured-books" class="nav-link">Featured</a></li>
                                    <li class="menu-item"><a href="index.html#popular-books" class="nav-link">Popular</a></li>
                                    <li class="menu-item"><a href="index.html#special-offer" class="nav-link">Offer</a></li>
                                    <li class="menu-item"><a href="index.html#latest-blog" class="nav-link">Articles</a></li>
                                </ul>
                                <div class="hamburger">
                                    <span class="bar"></span>
                                    <span class="bar"></span>
                                    <span class="bar"></span>
                                </div>
                            </div>
                        </nav>
                    </div>
                </div>
            </div>
        </header>
    </div>

    <section class="inner-page-hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title" id="pageTitle">Share Your Experience</h1>
                <p class="text-muted" id="pageSubtitle">Your feedback helps other readers find their next favorite book.</p>
            </div>
        </div>
    </section>

    <div class="container py-5" style="margin-top: -30px; position: relative; z-index: 2;">
        <div class="row justify-content-center">
            <div class="col-md-7">
                
                <div id="errorMessage" class="alert alert-danger mb-4" style="display: none;"></div>
                <div id="successMessage" class="alert alert-success mb-4" style="display: none;"></div>

                <div class="modern-card p-5">
                    <div id="bookInfo" class="text-center mb-5 p-4 rounded" style="background: var(--brand-light); display: none;">
                        <span class="text-uppercase small tracking-widest text-muted d-block mb-2">Reviewing</span>
                        <h3 class="mb-1" id="bookTitle" style="font-family: var(--heading-font); color: var(--brand-dark);">Loading...</h3>
                        <p class="text-muted mb-0" id="bookAuthor"></p>
                    </div>

                    <form id="reviewForm" class="modern-form">
                        <!-- Star Rating -->
                        <div class="mb-5">
                            <label class="form-label d-block text-center mb-4">How would you rate this book?</label>
                            <div class="star-rating" id="starRating">
                                <input type="radio" id="star5" class="star-input" name="rating" value="5">
                                <label for="star5" class="star-label">★</label>

                                <input type="radio" id="star4" class="star-input" name="rating" value="4">
                                <label for="star4" class="star-label">★</label>

                                <input type="radio" id="star3" class="star-input" name="rating" value="3">
                                <label for="star3" class="star-label">★</label>

                                <input type="radio" id="star2" class="star-input" name="rating" value="2">
                                <label for="star2" class="star-label">★</label>

                                <input type="radio" id="star1" class="star-input" name="rating" value="1">
                                <label for="star1" class="star-label">★</label>
                            </div>
                            <div class="rating-display" id="ratingDisplay"></div>
                        </div>

                        <!-- Comment -->
                        <div class="mb-4">
                            <label for="comment" class="form-label">Review Content</label>
                            <textarea 
                                id="comment" 
                                class="form-control" 
                                rows="6"
                                placeholder="What did you love? What could be better? (Minimum 10 characters)"
                                required
                            ></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="mt-5 pt-3 border-top d-flex gap-3">
                            <button type="submit" class="btn btn-modern-mocha flex-grow-1 py-3" id="submitBtn">
                                <span id="submitText">Post Review</span>
                            </button>
                            <button type="button" class="btn btn-outline-secondary px-4" id="cancelBtn">Cancel</button>
                        </div>
                    </form>
                </div>

                <div class="text-center mt-4">
                    <a href="#" id="backLink" class="text-decoration-none text-muted" style="font-weight: 600;">← Back to Book Details</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer id="footer" class="py-5 bg-dark text-light mt-5">
        <div class="container text-center">
            <img src="images/main-logo.png" alt="logo" class="footer-logo mb-4" style="filter: brightness(0) invert(1); max-height: 40px;">
            <p class="text-muted">&copy; 2024 BookSaw. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/jquery-1.11.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/script.js"></script>
    <script src="js/navbar-auth.js"></script>
    <script>
        const API_BASE_URL = '/api';
        let currentUserId = null;
        let currentUserEmail = null;
        let bookId = null;
        let reviewId = null;
        let isEditMode = false;
        let existingReview = null;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async function() {
            const urlParams = new URLSearchParams(window.location.search);
            bookId = urlParams.get('bookId');
            reviewId = urlParams.get('reviewId');

            // Get user from sessionStorage
            currentUserId = sessionStorage.getItem('currentUserId');
            currentUserEmail = sessionStorage.getItem('currentUserEmail');

            // Check authentication
            if (!currentUserId || !currentUserEmail) {
                showError('Please log in first to write a review');
                setTimeout(() => {
                    window.location.href = 'login.html?redirect=book-details.html?bookId=' + encodeURIComponent(bookId);
                }, 2000);
                return;
            }

            // Validate bookId
            if (!bookId) {
                showError('No book selected. Please go back and try again.');
                return;
            }

            // Setup back link
            document.getElementById('backLink').href = 'book-details.html?bookId=' + encodeURIComponent(bookId);

            // Load book details
            await loadBookDetails();

            // Check if editing existing review
            if (reviewId) {
                isEditMode = true;
                await loadExistingReview();
            }

            setupStarRating();
            setupFormHandlers();
        });

        async function loadBookDetails() {
            try {
                const response = await fetch(`${API_BASE_URL}/books/${encodeURIComponent(bookId)}`);
                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    const book = data.book;
                    document.getElementById('bookTitle').textContent = book.title;
                    document.getElementById('bookAuthor').textContent = 'by ' + book.author;
                    document.getElementById('bookInfo').style.display = 'block';
                } else {
                    showError('Could not load book details');
                }
            } catch (error) {
                console.error('Error loading book:', error);
                showError('Error loading book details');
            }
        }

        async function loadExistingReview() {
            try {
                const response = await fetch(`${API_BASE_URL}/reviews/user/${encodeURIComponent(currentUserId)}`);
                const data = await response.json();

                if (response.ok && data.status === 'success' && data.reviews) {
                    existingReview = data.reviews.find(r => r.reviewId === reviewId);
                    if (existingReview) {
                        // Populate form with existing data
                        document.getElementById('pageTitle').textContent = 'Edit Your Review';
                        document.getElementById('pageSubtitle').textContent = 'Update your thoughts about this book';
                        document.getElementById('submitText').textContent = 'Update Review';

                        // Set rating
                        const ratingInput = document.getElementById('star' + existingReview.rating);
                        if (ratingInput) {
                            ratingInput.checked = true;
                            updateRatingDisplay(existingReview.rating);
                        }

                        // Set comment
                        document.getElementById('comment').value = existingReview.comment;
                    } else {
                        showError('Review not found');
                    }
                } else {
                    showError('Could not load existing review');
                }
            } catch (error) {
                console.error('Error loading review:', error);
                showError('Error loading review');
            }
        }

        function setupStarRating() {
            const stars = document.querySelectorAll('#starRating .star-input');
            stars.forEach(star => {
                star.addEventListener('change', function() {
                    updateRatingDisplay(this.value);
                });
            });
        }

        function updateRatingDisplay(rating) {
            const display = document.getElementById('ratingDisplay');
            if (rating) {
                display.textContent = '★'.repeat(rating) + '☆'.repeat(5 - rating) + ' (' + rating + '/5)';
            } else {
                display.textContent = '';
            }
        }

        function setupFormHandlers() {
            const form = document.getElementById('reviewForm');
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                await submitReview();
            });

            document.getElementById('cancelBtn').addEventListener('click', function() {
                window.location.href = 'book-details.html?bookId=' + encodeURIComponent(bookId);
            });
        }

        async function submitReview() {
            const ratingInput = document.querySelector('#starRating .star-input:checked');
            const rating = ratingInput ? ratingInput.value : null;
            const comment = document.getElementById('comment').value.trim();

            // Validate
            if (!rating) {
                showError('Please select a rating');
                return;
            }

            if (comment.length < 10) {
                showError('Review must be at least 10 characters long');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const originalText = submitText.textContent;

            try {
                submitBtn.disabled = true;
                submitText.innerHTML = '<span class="loading-spinner"></span>Submitting...';

                let endpoint, method, body;

                if (isEditMode && reviewId) {
                    // Edit existing review
                    endpoint = `${API_BASE_URL}/reviews/user/${encodeURIComponent(currentUserId)}/${encodeURIComponent(reviewId)}`;
                    method = 'PUT';
                    body = { rating: Number(rating), comment };
                } else {
                    // Create new review
                    endpoint = `${API_BASE_URL}/reviews/user/${encodeURIComponent(currentUserId)}/book/${encodeURIComponent(bookId)}`;
                    method = 'POST';
                    body = { rating: Number(rating), comment };
                }

                const response = await fetch(endpoint, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    showSuccess(isEditMode ? 'Review updated successfully!' : 'Review posted successfully!');
                    setTimeout(() => {
                        window.location.href = 'book-details.html?bookId=' + encodeURIComponent(bookId);
                    }, 1500);
                } else {
                    showError(data.message || 'Failed to save review');
                    submitBtn.disabled = false;
                    submitText.textContent = originalText;
                }
            } catch (error) {
                console.error('Error submitting review:', error);
                showError('An error occurred while saving your review');
                submitBtn.disabled = false;
                submitText.textContent = originalText;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
