<!DOCTYPE html>
<html lang="en">
<head>
    <title>Checkout | BookSaw</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="css/normalize.css">
    <link rel="stylesheet" type="text/css" href="icomoon/icomoon.css">
    <link rel="stylesheet" type="text/css" href="css/vendor.css">
    <link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap">
	<link rel="stylesheet" type="text/css" href="css/modern-override.css">
    <link rel="stylesheet" type="text/css" href="css/modern-theme.css">
</head>
<body data-bs-spy="scroll" data-bs-target="#header" tabindex="0">

    <div id="header-wrap">
        <div class="top-content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-6">
                        <div class="social-links">
                            <ul>
                                <li><a href="#"><i class="icon icon-facebook"></i></a></li>
                                <li><a href="#"><i class="icon icon-twitter"></i></a></li>
                                <li><a href="#"><i class="icon icon-youtube-play"></i></a></li>
                                <li><a href="#"><i class="icon icon-behance-square"></i></a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="right-element">
                            <a href="#" class="user-account for-buy"><i class="icon icon-user"></i><span id="userGreeting">Account</span></a>
                            <a href="cart.html" class="cart for-buy"><i class="icon icon-clipboard"></i><span>Cart:(0 $)</span></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <header id="header">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-2">
                        <div class="main-logo">
                            <a href="index.html"><img src="images/main-logo.png" alt="logo"></a>
                        </div>
                    </div>
                    <div class="col-md-10">
                        <nav id="navbar">
                            <div class="main-menu stellarnav">
                                <ul class="menu-list">
                                    <li class="menu-item"><a href="index.html">Home</a></li>
                                    <li class="menu-item"><a href="index.html#featured-books" class="nav-link">Featured</a></li>
                                    <li class="menu-item"><a href="index.html#popular-books" class="nav-link">Popular</a></li>
                                    <li class="menu-item"><a href="index.html#special-offer" class="nav-link">Offer</a></li>
                                    <li class="menu-item"><a href="index.html#latest-blog" class="nav-link">Articles</a></li>
                                </ul>
                                <div class="hamburger">
                                    <span class="bar"></span>
                                    <span class="bar"></span>
                                    <span class="bar"></span>
                                </div>
                            </div>
                        </nav>
                    </div>
                </div>
            </div>
        </header>
    </div>

    <!-- Page Header Hero -->
    <section class="inner-page-hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">Checkout</h1>
                <p class="text-muted">Review your order and complete your purchase securely.</p>
            </div>
        </div>
    </section>

    <!-- Main Checkout Content -->
    <div class="container py-5" style="margin-top: -40px; position: relative; z-index: 2;">
        <div class="row g-4">
            <!-- Left Column: Order Form -->
            <div class="col-lg-8">
                <!-- Order Items Review -->
                <div class="modern-card p-4 mb-4">
                    <h3 class="mb-4" style="color: var(--brand-mocha); font-family: var(--heading-font); border-bottom: 2px solid var(--brand-mocha); display: inline-block; padding-bottom: 5px;">
                        <i class="fas fa-box me-2"></i>Order Items
                    </h3>
                    <div id="orderItemsList"></div>
                </div>

                <!-- Billing Address -->
                <div class="modern-card p-4 mb-4">
                    <h3 class="mb-4" style="color: var(--brand-mocha); font-family: var(--heading-font); border-bottom: 2px solid var(--brand-mocha); display: inline-block; padding-bottom: 5px;">
                        <i class="fas fa-map-marker-alt me-2"></i>Billing Address
                    </h3>
                    <form id="checkoutForm" class="modern-form">
                        <div class="row">
                            <div class="col-12 mb-4">
                                <label for="address" class="form-label">Address</label>
                                <input type="text" id="address" class="form-control" placeholder="Street address" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="city" class="form-label">City</label>
                                <input type="text" id="city" class="form-control" placeholder="City" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="zipCode" class="form-label">Zip Code</label>
                                <input type="text" id="zipCode" class="form-control" placeholder="Zip Code" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="state" class="form-label">State</label>
                                <input type="text" id="state" class="form-control" placeholder="State" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="country" class="form-label">Country</label>
                                <input type="text" id="country" class="form-control" placeholder="Country" value="United States" required>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Payment Method Selection -->
                <div class="modern-card p-4 mb-4">
                    <h3 class="mb-4" style="color: var(--brand-mocha); font-family: var(--heading-font); border-bottom: 2px solid var(--brand-mocha); display: inline-block; padding-bottom: 5px;">
                        <i class="fas fa-credit-card me-2"></i>Payment Method
                    </h3>
                    <div id="paymentMethodsList"></div>
                    <div class="error-message" id="paymentError"></div>
                    <div class="mt-4 pt-3 border-top">
                        <button type="button" class="btn btn-outline-primary" id="addPaymentCardBtn">
                            <i class="fas fa-plus me-2"></i>Manage Cards
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Column: Order Summary -->
            <div class="col-lg-4">
                <div class="modern-card p-4 sticky-top" style="top: 20px;">
                    <h3 class="mb-4" style="color: var(--brand-mocha); font-family: var(--heading-font); border-bottom: 2px solid var(--brand-mocha); display: inline-block; padding-bottom: 5px;">
                        <i class="fas fa-receipt me-2"></i>Order Summary
                    </h3>
                    <div id="orderSummary" class="mt-3"></div>
                    <div class="error-message" id="checkoutError"></div>
                    
                    <div class="mt-4 pt-4 border-top">
                        <button id="completePaymentBtn" class="btn btn-modern-mocha btn-large w-100 py-3">
                            <i class="fas fa-lock me-2"></i>Complete Payment
                        </button>
                    </div>
                    <div class="text-center mt-3 small text-muted">
                        <i class="fas fa-shield-alt me-1"></i> Secure SSL Encrypted Payment
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer id="footer" class="py-5 bg-dark text-light mt-5">
        <div class="container text-center">
            <img src="images/main-logo.png" alt="logo" class="footer-logo mb-4" style="filter: brightness(0) invert(1); max-height: 40px;">
            <p class="text-muted">&copy; 2024 BookSaw. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/jquery-1.11.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/script.js"></script>
    <script src="js/navbar-auth.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
