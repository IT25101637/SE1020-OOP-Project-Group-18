<!DOCTYPE html>
<html lang="en">

<head>
  <title>Cart - BookSaw Book Store</title>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">

  <link rel="stylesheet" type="text/css" href="css/normalize.css">
  <link rel="stylesheet" type="text/css" href="icomoon/icomoon.css">
  <link rel="stylesheet" type="text/css" href="css/vendor.css">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body data-bs-spy="scroll" data-bs-target="#header" tabindex="0">

  <div id="header-wrap">
    <div class="top-content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-6">
            <div class="social-links">
              <ul>
                <li><a href="#"><i class="icon icon-facebook"></i></a></li>
                <li><a href="#"><i class="icon icon-twitter"></i></a></li>
                <li><a href="#"><i class="icon icon-youtube-play"></i></a></li>
                <li><a href="#"><i class="icon icon-behance-square"></i></a></li>
              </ul>
            </div>
          </div>
          <div class="col-md-6">
            <div class="right-element">
              <a href="#" class="user-account for-buy"><i class="icon icon-user"></i><span>Account</span></a>
              <a href="cart.html" class="cart for-buy"><i class="icon icon-clipboard"></i><span>Cart:(0 $0.00)</span></a>
              <div class="action-menu">
                <div class="search-bar">
                  <a href="#" class="search-button search-toggle" data-selector="#header-wrap">
                    <i class="icon icon-search"></i>
                  </a>
                  <form role="search" method="get" class="search-box">
                    <input class="search-field text search-input" placeholder="Search" type="search">
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <header id="header">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-2">
            <div class="main-logo">
              <a href="index.html"><img src="images/main-logo.png" alt="logo"></a>
            </div>
          </div>
          <div class="col-md-10">
            <nav id="navbar">
              <div class="main-menu stellarnav">
                <ul class="menu-list">
                  <li class="menu-item"><a href="index.html">Home</a></li>
                  <li class="menu-item"><a href="index.html#featured-books" class="nav-link">Featured</a></li>
                  <li class="menu-item"><a href="index.html#popular-books" class="nav-link">Popular</a></li>
                  <li class="menu-item active"><a href="cart.html" class="nav-link">Cart</a></li>
                  <li class="menu-item"><a href="login.html" class="nav-link">Login</a></li>
                </ul>
                <div class="hamburger">
                  <span class="bar"></span>
                  <span class="bar"></span>
                  <span class="bar"></span>
                </div>
              </div>
            </nav>
          </div>
        </div>
      </div>
    </header>
  </div>

  <section id="cart-section" class="py-5 my-5">
    <div class="container">
      <div class="cart-wrapper">
        <div class="cart-header-row">
          <div class="cart-head item-col">ITEMS</div>
          <div class="cart-head qty-col">QUANTITY</div>
          <div class="cart-head price-col">PRICE</div>
          <div class="cart-head total-col">TOTAL</div>
          <div class="cart-head remove-col"></div>
        </div>

        <div id="cartItemsList"></div>

        <div id="emptyCartState" class="empty-cart-message" style="display: none;">
          Your cart is empty. Start adding books from featured and popular sections.
        </div>

        <div class="cart-summary-panel">
          <div class="summary-line">
            <span>Items</span>
            <strong id="cartCountValue">0</strong>
          </div>
          <div class="summary-line">
            <span>Subtotal</span>
            <strong id="subtotalValue">USD $0.00</strong>
          </div>
          <div class="summary-line total-line">
            <span>Total</span>
            <strong id="totalValue">USD $0.00</strong>
          </div>
        </div>

        <div class="cart-actions">
          <button type="button" class="btn btn-outline-accent" id="continueShoppingBtn">Continue Shopping</button>
           <button type="button" class="btn btn-accent" id="checkoutBtn">Process Checkout</button>
        </div>
         <script>
           document.getElementById('checkoutBtn').onclick = function() {
             window.location.href = 'checkout.html';
           };
         </script>
      </div>
    </div>
  </section>

  <script src="js/jquery-1.11.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
    crossorigin="anonymous"></script>
  <script src="js/plugins.js"></script>
  <script src="js/script.js"></script>
  <script src="js/navbar-auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/cart-page.js"></script>

</body>

</html>
